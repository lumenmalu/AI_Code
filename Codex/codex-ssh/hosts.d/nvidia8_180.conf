# 主机配置: nvidia8_180
# 与 claude-ssh/hosts.d/nvidia8_180.conf 共享同一远程目录与挂载点,可同时使用 Codex 和 Claude。
#
# 说明:
#   - 对应 ~/.ssh/config 中已有的别名 Nvidia-105-wlan (10.17.8.180)。
#   - SSH_ALIAS 直接复用该别名,免密只需配一次,Codex 与 Claude 共用。
#   - 如需独立密钥,把 SSH_ALIAS 置空后运行: ./remote-codex.sh setup-ssh nvidia8_180

# SSH 用户名
REMOTE_USER="nvidia"

# IP 地址或域名
REMOTE_HOST="10.17.8.180"

# SSH 端口(默认 22)
SSH_PORT="22"

# 远程项目目录(绝对路径)
REMOTE_DIR="/home/nvidia/wujie_code/bmi088_imu"

# 本地挂载点(与 claude-ssh 共享同一挂载点,挂载一次两个工具共用)
LOCAL_MOUNT="$HOME/remote/nvidia8_180"

# 复用 ~/.ssh/config 中已有的别名
SSH_ALIAS="Nvidia-105-wlan"

# Codex 沙箱模式: workspace-write | danger-full-access
# workspace-write      只允许写入工作目录(SSH 出网常被拦住)
# danger-full-access   完全访问,远程编译/测试需要 ssh 时用
SANDBOX_MODE="danger-full-access"

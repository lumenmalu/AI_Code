# 主机配置: robot1
# 由 remote-codex.sh 管理,可手动编辑
#
# 文件说明:
#   - 文件名(去掉 .conf)即主机别名,例如 robot1
#   - 每个字段含义见下方注释
#   - 复制本文件可快速新增主机: cp robot1.conf robot2.conf 后修改

# SSH 用户名
REMOTE_USER="pnd-humanoid"

# IP 地址或域名
REMOTE_HOST="192.168.31.94"

# SSH 端口(默认 22)
SSH_PORT="22"

# 远程项目目录(绝对路径)
REMOTE_DIR="/home/pnd-humanoid/Documents/test/luchuang/test_lu"

# 本地挂载点(与 claude-ssh 共享同一挂载点,挂载一次两个工具共用)
LOCAL_MOUNT="$HOME/remote/robot31_94"

# Codex 沙箱模式: workspace-write | danger-full-access
# workspace-write      只允许写入工作目录(推荐)
# danger-full-access   完全访问(需要 SSH 执行远程命令时用)
SANDBOX_MODE="workspace-write"

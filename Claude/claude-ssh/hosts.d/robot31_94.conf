# 主机配置: robot31_94
# 由 remote-claude.sh 管理,可手动编辑
#
# 说明:
#   - 文件名(去掉 .conf)即主机别名
#   - SSH_ALIAS 复用了 codex-ssh 已配置好的免密别名 robot31_94,
#     因此无需再为本工具单独配置 SSH 密钥,开机即可挂载。
#   - 如需独立密钥,把 SSH_ALIAS 置空后运行: ./remote-claude.sh setup-ssh robot31_94

# SSH 用户名
REMOTE_USER="pnd-humanoid"

# IP 地址或域名
REMOTE_HOST="192.168.31.94"

# SSH 端口(默认 22)
SSH_PORT="22"

# 远程项目目录(绝对路径)
REMOTE_DIR="/home/pnd-humanoid/Documents/test/luchuang/test_lu"

# 本地挂载点(与 codex-ssh 共享同一挂载点,挂载一次两个工具共用)
LOCAL_MOUNT="$HOME/remote/robot31_94"

# 复用已有的 SSH 别名(可选)
# 这里复用 codex-ssh 在 ~/.ssh/config 中配好的 robot31_94 别名
SSH_ALIAS="robot31_94"

# 启动 Claude 时是否跳过权限询问
# no  = 每次执行命令前询问(更安全)
# yes = 跳过所有权限检查(--dangerously-skip-permissions,适合受信任的局域网机器)
SKIP_PERMISSIONS="no"

# 主机配置: robot31_105
# 与 codex-ssh/hosts.d/robot31_105.conf 共享同一远程目录与挂载点,可同时使用 Claude 和 Codex。
#
# 说明:
#   - SSH_ALIAS 复用 codex-ssh 的别名 robot31_105,免密只需在 codex-ssh 配一次:
#       cd ~/Documents/AI_Code/Codex/codex-ssh && ./remote-codex.sh setup-ssh robot31_105
#     配好后 claude 自动复用,无需再配。
#   - 如需 claude 独立密钥,把 SSH_ALIAS 置空后运行: ./remote-claude.sh setup-ssh robot31_105

# SSH 用户名
REMOTE_USER="pnd-humanoid"

# IP 地址或域名
REMOTE_HOST="192.168.31.105"

# SSH 端口(默认 22)
SSH_PORT="22"

# 远程项目目录(绝对路径)
REMOTE_DIR="/home/pnd-humanoid/Documents/test/luchuang/test_lu"

# 本地挂载点(与 codex-ssh 共享同一挂载点,挂载一次两个工具共用)
LOCAL_MOUNT="$HOME/remote/robot31_105"

# 复用 codex-ssh 在 ~/.ssh/config 中配的别名(免密只需 codex 配一次)
SSH_ALIAS="robot31_105"

# 启动 Claude 时是否跳过权限询问
# no  = 每次执行命令前询问(更安全)
# yes = 跳过所有权限检查(--dangerously-skip-permissions,适合受信任的局域网机器)
SKIP_PERMISSIONS="no"

# 主机配置: nvidia8_180
# 与 codex-ssh/hosts.d/nvidia8_180.conf 共享同一远程目录与挂载点,可同时使用 Claude 和 Codex。
#
# 说明:
#   - 对应 ~/.ssh/config 中已有的别名 Nvidia-105-wlan (10.17.8.180)。
#   - SSH_ALIAS 直接复用该别名,免密只需配一次,Claude 与 Codex 共用。
#   - 如需独立密钥,把 SSH_ALIAS 置空后运行: ./remote-claude.sh setup-ssh nvidia8_180

# SSH 用户名
REMOTE_USER="nvidia"

# IP 地址或域名
REMOTE_HOST="10.17.8.180"

# SSH 端口(默认 22)
SSH_PORT="22"

# 远程项目目录(绝对路径)
REMOTE_DIR="/home/nvidia/atom"

# 本地挂载点(与 codex-ssh 共享同一挂载点,挂载一次两个工具共用)
LOCAL_MOUNT="$HOME/remote/nvidia8_180"

# 复用 ~/.ssh/config 中已有的别名
SSH_ALIAS="Nvidia-105-wlan"

# 启动 Claude 时是否跳过权限询问
# no  = 每次执行命令前询问(更安全)
# yes = 跳过所有权限检查(--dangerously-skip-permissions,适合受信任的局域网机器)
SKIP_PERMISSIONS="no"
